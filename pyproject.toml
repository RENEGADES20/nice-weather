[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nice-weather"
version = "0.1.0"
description = "Auditable Polymarket NYC/KLGA weather-market research and paper trading MVP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pandas>=2.2,<3",
  "plotly>=5.24,<7",
  "streamlit>=1.37,<2",
]

[project.optional-dependencies]
collector = [
  "boto3>=1.35,<2",
  "playwright>=1.48,<2",
  "pyarrow>=17,<22",
]
dev = [
  "boto3>=1.35,<2",
  "pyarrow>=17,<22",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
nice-weather = "nice_weather.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nice_weather = ["schema.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  ".venv*",
  ".ppt-build",
  "assets",
  "research_runs",
  "tools",
  "纽约天气交易MVP_项目架构与流程",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
